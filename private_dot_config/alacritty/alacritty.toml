[terminal.shell]
program = "/usr/bin/zsh"
args = ["-l"]

# Nerd Font, so that devicons/mini.files glyphs render instead of tofu boxes.
# Installed at ~/.local/share/fonts/JetBrainsMonoNerdFont/
[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
